name: COMICPOP
options:
  minimumXcodeGenVersion: 2.40.0
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: ''
targets:
  COMICPOP:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: COMICPOP
        excludes:
          - Info.plist
          - Resources/cards.json
      - path: COMICPOP/Resources/cards.json
        buildPhase: resources
    info:
      path: COMICPOP/Info.plist
      # XcodeGen REGENERATES this file. Properties must be specified here,
      # not only in a manually edited Info.plist.
      properties:
        CFBundleDisplayName: ムビコマ
        CFBundleName: COMICPOP
        CFBundleShortVersionString: 2.0.0
        CFBundleVersion: '1'
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        # Apple 90474: iPad-compatible builds must supply all four orientations.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPhone remains portrait-only in the native editor.
        "UISupportedInterfaceOrientations~iphone":
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: 漫画化する動画を選択するために使用します。
        NSPhotoLibraryAddUsageDescription: 生成した漫画を保存するときに使用します。
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.comicpop.dev
        GENERATE_INFOPLIST_FILE: NO
