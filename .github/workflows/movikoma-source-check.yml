name: Movikoma Swift source preflight
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'tests/**'
      - 'codemagic.yaml'
      - '.github/workflows/movikoma-source-check.yml'
  push:
    branches:
      - feat/movikoma-rex-reference-ui
    paths:
      - 'ios/**'
      - 'tests/**'
      - 'codemagic.yaml'
      - '.github/workflows/movikoma-source-check.yml'
jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Run exact Codemagic preflight on Linux
        run: |
          swiftc --version
          bash tests/run.sh
