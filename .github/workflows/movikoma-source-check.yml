name: Movikoma Swift source preflight
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'tests/**'
      - 'codemagic.yaml'
      - '.github/workflows/movikoma-source-check.yml'
  # An open PR already receives the branch's commits. A second push job
  # would run the exact same preflight twice, consuming unnecessary CI quota.
  workflow_dispatch:
concurrency:
  group: movikoma-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Run exact Codemagic preflight on Linux
        run: |
          swiftc --version
          bash tests/run.sh
