name: Movikoma native iOS Simulator compile
# macOS CI is intentionally manual to preserve scarce build minutes.
# Run once after the Ubuntu source preflight passes.
on:
  workflow_dispatch:
jobs:
  native-ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode environment
        run: xcodebuild -version
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
      - name: Generate native iPhone project
        run: cd ios && xcodegen generate --spec project.yml
      - name: Compile unsigned iOS Simulator app
        run: |
          cd ios
          xcodebuild -project COMICPOP.xcodeproj -scheme COMICPOP \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
