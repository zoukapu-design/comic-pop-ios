workflows:
  ios-unsigned-check:
    name: ムビコマ iOS / コンパイル検証（署名・アップロードなし）
    instance_type: mac_mini_m2
    max_build_duration: 35
    environment:
      xcode: latest
    scripts:
      - name: Validate catalogs and run Swift model tests
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          bash tests/run.sh 2>&1 | tee "$CM_BUILD_DIR/preflight.log"
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd "$CM_BUILD_DIR/ios"
          xcodegen generate --spec project.yml 2>&1 | tee "$CM_BUILD_DIR/xcodegen.log"
          test -f COMICPOP.xcodeproj/project.pbxproj
      - name: Compile unsigned iOS Simulator app and preserve diagnostics
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios"
          set +e
          xcodebuild -project COMICPOP.xcodeproj -scheme COMICPOP \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$CM_BUILD_DIR/ios-build.log"
          status=${PIPESTATUS[0]}
          set -e
          python3 - "$CM_BUILD_DIR/ios-build.log" "$CM_BUILD_DIR/ios-diagnostics.txt" <<'PY'
          from pathlib import Path
          import sys
          source=Path(sys.argv[1])
          output=Path(sys.argv[2])
          lines=source.read_text(encoding="utf-8",errors="replace").splitlines()
          errors=[line for line in lines if " error:" in line or "fatal error:" in line or "BUILD FAILED" in line]
          warnings=[line for line in lines if " warning:" in line]
          report=["ムビコマ iOS Simulator コンパイル診断",f"エラー行: {len(errors)}",f"警告行: {len(warnings)}",""]
          report+=errors[-150:] if errors else ["Swiftコンパイラ由来のエラー行は検出されませんでした"]
          report+=["","警告（末尾30件）",*warnings[-30:]]
          output.write_text("\n".join(report)+"\n",encoding="utf-8")
          print("\n".join(report[:4]))
          PY
          exit "$status"
    artifacts:
      - $CM_BUILD_DIR/preflight.log
      - $CM_BUILD_DIR/xcodegen.log
      - $CM_BUILD_DIR/ios-build.log
      - $CM_BUILD_DIR/ios-diagnostics.txt
      - $CM_BUILD_DIR/DerivedData/Build/Products/**/*.app

  ios-signed-ipa:
    name: ムビコマ iOS / 署名付きIPA（アップロードなし）
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.zoukapu.comicpop
      ios_signing:
        provisioning_profiles:
          - comicpop_appstore_profile
        certificates:
          - Cybernetic_Distribution
    scripts:
      - name: Validate application and Bundle ID
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          bash tests/run.sh
          : "${BUNDLE_ID:?Missing BUNDLE_ID in signed workflow}"
          python3 - <<'PY'
          import os,re
          value=os.environ['BUNDLE_ID'].strip()
          if not re.fullmatch(r'[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+',value) or value.startswith('com.example.'):
              raise SystemExit("BUNDLE_ID must be a registered unique Apple Bundle ID.")
          print("Bundle ID format: OK")
          PY
      - name: Generate Xcode project with registered App ID
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path("ios/project.yml")
          source=p.read_text(encoding="utf-8")
          placeholder='com.example.comicpop.dev'
          assert source.count(placeholder)==1,"Expected one development Bundle ID"
          p.write_text(source.replace(placeholder,os.environ['BUNDLE_ID'].strip()),encoding="utf-8")
          PY
          # XcodeGen regenerates Info.plist. Set CFBundleVersion after generation.
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd "$CM_BUILD_DIR/ios"
          xcodegen generate --spec project.yml
          plutil -replace CFBundleVersion -string "${BUILD_NUMBER:-1}" COMICPOP/Info.plist
          test -f COMICPOP.xcodeproj/project.pbxproj
      - name: Apply Codemagic managed signing profiles
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios"
          xcode-project use-profiles --project COMICPOP.xcodeproj
      - name: Build signed iPhone IPA (do not publish)
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios"
          xcode-project build-ipa --project COMICPOP.xcodeproj --scheme COMICPOP
    artifacts:
      - $CM_BUILD_DIR/ios/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # TestFlight publishing is intentionally disabled until owner reviews IPA.

  ios-testflight-upload:
    name: ムビコマ iOS / Upload to TestFlight (manual trigger)
    integrations:
      app_store_connect: Codemagic Cybernetic
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.zoukapu.comicpop
      ios_signing:
        provisioning_profiles:
          - comicpop_appstore_profile
        certificates:
          - Cybernetic_Distribution
    scripts:
      - name: Validate application and Bundle ID
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          bash tests/run.sh
          : "${BUNDLE_ID:?Missing BUNDLE_ID in signed workflow}"
          python3 - <<'PY'
          import os,re
          value=os.environ['BUNDLE_ID'].strip()
          if not re.fullmatch(r'[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+',value) or value.startswith('com.example.'):
              raise SystemExit("BUNDLE_ID must be a registered unique Apple Bundle ID.")
          print("Bundle ID format: OK")
          PY
      - name: Generate Xcode project with registered App ID
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path("ios/project.yml")
          source=p.read_text(encoding="utf-8")
          placeholder='com.example.comicpop.dev'
          assert source.count(placeholder)==1,"Expected one development Bundle ID"
          p.write_text(source.replace(placeholder,os.environ['BUNDLE_ID'].strip()),encoding="utf-8")
          PY
          # XcodeGen regenerates Info.plist. Set CFBundleVersion after generation.
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd "$CM_BUILD_DIR/ios"
          xcodegen generate --spec project.yml
          plutil -replace CFBundleVersion -string "${BUILD_NUMBER:-1}" COMICPOP/Info.plist
          test -f COMICPOP.xcodeproj/project.pbxproj
      - name: Apply Codemagic managed signing profiles
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios"
          xcode-project use-profiles --project COMICPOP.xcodeproj
      - name: Build signed iPhone IPA (do not publish)
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios"
          xcode-project build-ipa --project COMICPOP.xcodeproj --scheme COMICPOP
      - name: Verify IPA launch screen and iPad orientations before upload
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          python3 - <<'PY'
          import pathlib, plistlib, zipfile
          folder=pathlib.Path("ios/build/ios/ipa")
          ipas=list(folder.glob("*.ipa"))
          if len(ipas)!=1:
              raise SystemExit(f"Expected 1 signed IPA under {folder}, got {len(ipas)}")
          with zipfile.ZipFile(ipas[0]) as z:
              plists=[n for n in z.namelist() if n.startswith("Payload/") and n.endswith(".app/Info.plist")]
              assert len(plists)==1, f"Could not locate app Info.plist: {plists}"
              info=plistlib.loads(z.read(plists[0]))
              assert info.get("CFBundleIdentifier")=="com.zoukapu.comicpop", "Bundle ID mismatch"
              assert info.get("UILaunchStoryboardName")=="LaunchScreen", "90475: missing launch storyboard name"
              required={"UIInterfaceOrientationPortrait","UIInterfaceOrientationPortraitUpsideDown","UIInterfaceOrientationLandscapeLeft","UIInterfaceOrientationLandscapeRight"}
              assert required.issubset(set(info.get("UISupportedInterfaceOrientations",[]))), "90474: missing iPad orientations"
              assert "UIInterfaceOrientationPortrait" in info.get("UISupportedInterfaceOrientations~iphone",[]), "iPhone portrait orientation missing"
              assert any("LaunchScreen.storyboardc/" in n for n in z.namelist()), "90475: compiled storyboard missing"
              print("PASS: IPA launch screen storyboard, four iPad orientations, portrait iPhone, bundle ID")
          PY
    artifacts:
      - $CM_BUILD_DIR/ios/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
    # Uploads the signed IPA to App Store Connect only. The owner adds the build to internal testers manually.

  ios-simulator-screenshot:
    name: ムビコマ iOS / 初回案内＋実ホーム画面キャプチャ
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Validate Swift models and app resources
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          bash tests/run.sh
      - name: Generate project and compile Simulator app
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios"
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate --spec project.yml
          xcodebuild -project COMICPOP.xcodeproj -scheme COMICPOP \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$CM_BUILD_DIR/simulator-build.log"
      - name: Capture a static screenshot on Codemagic macOS Simulator
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          SIMULATOR_ID="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); v=[x for a in d["devices"].values() for x in a if x.get("isAvailable") and x.get("name","").startswith("iPhone")]; print(v[0]["udid"] if v else "")')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No iPhone simulator runtime is installed on this Codemagic build machine." >&2
            exit 1
          fi
          APP_PATH="$CM_BUILD_DIR/DerivedData/Build/Products/Debug-iphonesimulator/COMICPOP.app"
          test -d "$APP_PATH"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" "$APP_PATH"
          mkdir -p "$CM_BUILD_DIR/screenshots"
          # Capture onboarding, then launch the ACTUAL home by bypassing only
          # the one-time welcome flag. Never substitute a static reference JPG.
          xcrun simctl launch "$SIMULATOR_ID" com.example.comicpop.dev
          sleep 4
          xcrun simctl io "$SIMULATOR_ID" screenshot "$CM_BUILD_DIR/screenshots/movikoma-welcome.png"
          xcrun simctl terminate "$SIMULATOR_ID" com.example.comicpop.dev
          xcrun simctl launch "$SIMULATOR_ID" com.example.comicpop.dev -pop.didSeeWelcome YES
          sleep 5
          xcrun simctl io "$SIMULATOR_ID" screenshot "$CM_BUILD_DIR/screenshots/movikoma-home.png"
          xcrun simctl shutdown "$SIMULATOR_ID" || true
    artifacts:
      - $CM_BUILD_DIR/screenshots/*.png
      - $CM_BUILD_DIR/simulator-build.log
      - $CM_BUILD_DIR/DerivedData/Build/Products/**/*.app
    # Static screenshots work without Codemagic's Team-only Quick launch.
    # This workflow is manually triggered; it never uploads to App Store.
