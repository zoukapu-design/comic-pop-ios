workflows:
  ios-unsigned-check:
    name: COMIC POP iOS / Source & Simulator Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Validate catalogs and run Swift model tests
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          bash tests/run.sh
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd "$CM_BUILD_DIR/ios"
          xcodegen generate --spec project.yml
          test -f COMICPOP.xcodeproj/project.pbxproj
      - name: Build unsigned iOS Simulator app
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios"
          xcodebuild -project COMICPOP.xcodeproj -scheme COMICPOP \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$CM_BUILD_DIR/ios-build.log"
    artifacts:
      - $CM_BUILD_DIR/ios-build.log
      - $CM_BUILD_DIR/DerivedData/Build/Products/**/*.app

  ios-signed-ipa:
    name: COMIC POP iOS / Signed IPA (manual)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - ios_config
        - appstore_credentials
    scripts:
      - name: Validate source and signing settings
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          bash tests/run.sh
          : "${BUNDLE_ID:?Set BUNDLE_ID in the ios_config variable group}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Set Apple issuer ID as a secret}"
          : "${APP_STORE_CONNECT_KEY_IDENTIFIER:?Set Apple API key identifier as a secret}"
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Set Apple API private key as a secret}"
          : "${CERTIFICATE_PRIVATE_KEY:?Set distribution certificate RSA private key as a secret}"
          python3 - <<'PY'
          import os, re
          bundle_id = os.environ["BUNDLE_ID"].strip()
          if not re.fullmatch(r"[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+", bundle_id) or bundle_id.startswith("com.example."):
              raise SystemExit("BUNDLE_ID must be a registered, non-example Apple Bundle ID")
          print("Bundle ID format validated; Apple registration will be checked during signing")
          PY
      - name: Prepare app identity and Xcode project
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          python3 - <<'PY'
          import os
          from pathlib import Path
          bundle_id=os.environ["BUNDLE_ID"].strip()
          spec=Path("ios/project.yml")
          original=spec.read_text(encoding="utf-8")
          old="com.example.comicpop.dev"
          if original.count(old)!=1:
              raise SystemExit("Expected one placeholder bundle identifier in XcodeGen project")
          spec.write_text(original.replace(old,bundle_id),encoding="utf-8")
          PY
          plutil -replace CFBundleVersion -string "${BUILD_NUMBER:-1}" ios/COMICPOP/Info.plist
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          cd "$CM_BUILD_DIR/ios"
          xcodegen generate --spec project.yml
          test -f COMICPOP.xcodeproj/project.pbxproj
      - name: Fetch Apple distribution signing assets
        script: |
          set -euo pipefail
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles --project "$CM_BUILD_DIR/ios/COMICPOP.xcodeproj"
      - name: Build signed IPA without publishing
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios"
          xcode-project build-ipa --project "$CM_BUILD_DIR/ios/COMICPOP.xcodeproj" --scheme COMICPOP
    artifacts:
      - $CM_BUILD_DIR/ios/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # No publishing block: manual signed-build verification comes first.

  ios-simulator-screenshot:
    name: COMIC POP iOS / Simulator screenshot (no Team required)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Validate Swift models and app resources
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          bash tests/run.sh
      - name: Generate project and compile Simulator app
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/ios"
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen generate --spec project.yml
          xcodebuild -project COMICPOP.xcodeproj -scheme COMICPOP \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$CM_BUILD_DIR/simulator-build.log"
      - name: Capture a static screenshot on Codemagic macOS Simulator
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          SIMULATOR_ID="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); v=[x for a in d["devices"].values() for x in a if x.get("isAvailable") and x.get("name","").startswith("iPhone")]; print(v[0]["udid"] if v else "")')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No iPhone simulator runtime is installed on this Codemagic build machine." >&2
            exit 1
          fi
          APP_PATH="$CM_BUILD_DIR/DerivedData/Build/Products/Debug-iphonesimulator/COMICPOP.app"
          test -d "$APP_PATH"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" "$APP_PATH"
          xcrun simctl launch "$SIMULATOR_ID" com.example.comicpop.dev
          sleep 6
          mkdir -p "$CM_BUILD_DIR/screenshots"
          xcrun simctl io "$SIMULATOR_ID" screenshot "$CM_BUILD_DIR/screenshots/comicpop-launch.png"
          xcrun simctl shutdown "$SIMULATOR_ID" || true
    artifacts:
      - $CM_BUILD_DIR/screenshots/*.png
      - $CM_BUILD_DIR/simulator-build.log
      - $CM_BUILD_DIR/DerivedData/Build/Products/**/*.app
    # Static screenshots work without Codemagic's Team-only Quick launch.
    # This workflow is manually triggered; it never uploads to App Store.
